meters:
- name: conversions
  description: Successful, non-sandbox PDF conversions counted against the monthly plan allowance.
  unit: conversions
  aggregation: sum
  dimensions:
  - account
  - api
- name: overage_conversions
  description: Conversions beyond the included monthly quota, billed at a fixed per-conversion rate.
  unit: conversions
  aggregation: sum
  dimensions:
  - account
- name: sandbox_conversions
  description: Watermarked sandbox conversions, which are not billed and do not consume the monthly quota.
  unit: conversions
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track monthly usage via the GET /usage endpoint and the X-Monthly-Limit / X-Monthly-Used response headers.
- name: Allocation
  description: Issue separate API keys per workload or team to attribute conversion spend to cost centers.
- name: Optimization
  description: Use sandbox mode for development to avoid billed conversions; right-size the monthly plan to expected volume to minimize per-conversion overage.
- name: Accountability
  description: Review successful-conversion counts monthly against the plan allowance and overage budget.
