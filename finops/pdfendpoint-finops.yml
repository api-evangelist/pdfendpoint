created: '2026-06-25'
modified: '2026-06-25'
reconciled: false
tags:
- PDF
- HTML to PDF
- Conversion
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of PDFEndpoint spend. PDFEndpoint bills per successful PDF
  conversion against a monthly plan allowance, with additional conversions
  beyond the included quota billed at a fixed per-conversion overage rate.
  Sandbox conversions are watermarked and not billed, and failed conversions
  are not charged. Cost is therefore driven by the count of successful,
  non-sandbox conversions.
notes: >-
  Per-conversion overage rate and included monthly counts are subject to
  change; verify against https://pdfendpoint.com/pricing during reconciliation.
sources:
- https://pdfendpoint.com/pricing
- https://pdfendpoint.com/docs
