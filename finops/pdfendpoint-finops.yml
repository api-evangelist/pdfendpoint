publisherName: PDFEndpoint
serviceCategory: Document Generation
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: PDFEndpoint
  ServiceCategory: Document Generation
  ProviderName: PDFEndpoint
  PublisherName: PDFEndpoint
  InvoiceIssuerName: PDFEndpoint
  BillingCurrency: USD
