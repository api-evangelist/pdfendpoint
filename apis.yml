aid: pdfendpoint
url: https://raw.githubusercontent.com/api-evangelist/pdfendpoint/refs/heads/main/apis.yml
name: PDFEndpoint
kind: company
description: PDFEndpoint is a lightweight HTML and URL to PDF conversion API. A single
  REST endpoint renders raw HTML or a publicly accessible HTTPS URL into a PDF using
  a headless browser, with extensive options for page size, margins, orientation,
  headers and footers, encryption, and multiple delivery modes (JSON URL, base64,
  inline, webhook, S3, GCP). A sandbox mode watermarks output without consuming the
  monthly quota.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- PDF
- HTML to PDF
- URL to PDF
- Document Generation
- Conversion
created: '2026-06-25'
modified: '2026-06-25'
specificationVersion: '0.19'
apis:
- aid: pdfendpoint:convert-html-api
  name: PDFEndpoint Convert HTML API
  tags:
  - PDF
  - HTML to PDF
  - Conversion
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://pdfendpoint.com/docs
  baseURL: https://api.pdfendpoint.com/v1
  properties:
  - url: https://pdfendpoint.com/docs
    type: Documentation
  - url: openapi/pdfendpoint-openapi.yml
    type: OpenAPI
  - url: collections/pdfendpoint.postman_collection.json
    type: PostmanCollection
  - url: collections/pdfendpoint.opencollection.json
    type: OpenCollection
  description: Converts raw HTML content into a PDF via POST /convert, with options
    for page size, orientation, margins, viewport, zoom, CSS/JS injection, Liquid
    templating, headers and footers, image compression, and encryption.
- aid: pdfendpoint:convert-url-api
  name: PDFEndpoint Convert URL API
  tags:
  - PDF
  - URL to PDF
  - Conversion
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://pdfendpoint.com/docs/document/url
  baseURL: https://api.pdfendpoint.com/v1
  properties:
  - url: https://pdfendpoint.com/docs/document/url
    type: Documentation
  - url: openapi/pdfendpoint-openapi.yml
    type: OpenAPI
  - url: collections/pdfendpoint.postman_collection.json
    type: PostmanCollection
  - url: collections/pdfendpoint.opencollection.json
    type: OpenCollection
  description: Converts a publicly accessible HTTPS URL into a PDF via POST /convert
    using the url parameter, with wait-for-selector, network, cookie, header, basic
    auth, and geolocation controls for rendering dynamic pages.
- aid: pdfendpoint:renders-delivery-api
  name: PDFEndpoint Renders and Delivery API
  tags:
  - PDF
  - Webhooks
  - Storage
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://pdfendpoint.com/docs/delivery-mode
  baseURL: https://api.pdfendpoint.com/v1
  properties:
  - url: https://pdfendpoint.com/docs/delivery-mode
    type: Documentation
  - url: openapi/pdfendpoint-openapi.yml
    type: OpenAPI
  - url: collections/pdfendpoint.postman_collection.json
    type: PostmanCollection
  - url: collections/pdfendpoint.opencollection.json
    type: OpenCollection
  description: Manages generated renders and delivery. Supports delivery modes including
    json, base64, inline, webhook, s3, gcp, and jsonp; lists created PDFs via GET
    /list, deletes a render via DELETE /remove/{task_id}, and reports usage via GET
    /usage and health via GET /health.
