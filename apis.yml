name: PDFEndpoint
kind: company
description: PDFEndpoint is a lightweight HTML and URL to PDF conversion API. A single
  REST endpoint renders raw HTML or a publicly accessible HTTPS URL into a PDF using
  a headless browser, with extensive options for page size, margins, orientation,
  headers and footers, encryption, and multiple delivery modes (JSON URL, base64,
  inline, webhook, S3, GCP). A sandbox mode watermarks output without consuming the
  monthly quota.
